<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Asignaturas profesor · NOL 25/26</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/nol.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="profesor-asignaturas.html">NOL Profesor</a>
      <div class="ms-auto">
        <button class="btn btn-outline-warning btn-sm" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 nol-page-title">Mis asignaturas</h1>
    <p class="text-muted">
      Estas son las asignaturas que impartes este curso. En cada tarjeta verás la
      <strong>nota media</strong> del alumnado matriculado. Pulsa «Ver alumnado» para
      consultar las fichas individuales y modificar calificaciones.
    </p>

    <div class="alert alert-danger d-none" id="errorBox"></div>
    <div class="row g-3" id="asignaturasBox"></div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    function detalleAsignatura(a) {
      var partes = [];
      if (a.curso) partes.push('Curso ' + a.curso);
      if (a.cuatrimestre) partes.push('Cuatrimestre ' + a.cuatrimestre);
      if (a.creditos) partes.push(a.creditos + ' créditos');
      return partes.join(' · ');
    }

    // Carga asíncrona de la media de una asignatura concreta y la pinta en su tarjeta.
    function cargarMedia(acr) {
      ajax(API.profesorAlumnos(acr)).then(function (data) {
        var alumnos = safeArray(data);
        var span = document.getElementById('media_' + acr);
        if (span) span.textContent = 'Nota media: ' + textoMedia(alumnos);
      }).catch(function () {
        var span = document.getElementById('media_' + acr);
        if (span) span.textContent = 'Nota media: n/d';
      });
    }

    function renderAsignaturas(data) {
      var box = document.getElementById('asignaturasBox');
      var asignaturas = safeArray(data);

      if (!asignaturas.length) {
        box.innerHTML = '<div class="col-12"><div class="alert alert-info">Todavía no tienes asignaturas asignadas.</div></div>';
        return;
      }

      var html = '';
      var acrs = [];
      for (var i = 0; i < asignaturas.length; i++) {
        var a = asignaturas[i];
        var acr = getAcronimo(a);
        acrs.push(acr);

        html += '<div class="col-md-4">';
        html += '  <div class="card h-100 shadow-sm nol-card-accent">';
        html += '    <div class="card-body d-flex flex-column">';
        html += '      <div class="d-flex justify-content-between align-items-start">';
        html += '        <h2 class="h5 mb-1">' + acr + '</h2>';
        html += '      </div>';
        html += '      <p class="mb-1 fw-semibold">' + getNombreAsignatura(a) + '</p>';
        html += '      <p class="text-muted small mb-2">' + detalleAsignatura(a) + '</p>';
        html += '      <span class="nol-badge mb-3" id="media_' + acr + '">Nota media: …</span>';
        html += '      <a class="btn btn-success btn-sm mt-auto" href="profesor-alumnos.html?asig=' + encodeURIComponent(acr) + '">Ver alumnado</a>';
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
      }

      box.innerHTML = html;

      // Una vez pintadas las tarjetas, pedimos la media de cada una.
      for (var j = 0; j < acrs.length; j++) {
        cargarMedia(acrs[j]);
      }
    }

    ajax(API.profesorAsignaturas).then(renderAsignaturas).catch(showError);
  </script>
</body>
</html>
