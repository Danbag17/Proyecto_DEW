<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Alumnos asignatura · NOL 25/26</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/nol.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="profesor-asignaturas.html">NOL Profesor</a>
      <div class="ms-auto">
        <a class="btn btn-outline-light btn-sm me-2" href="profesor-asignaturas.html">Asignaturas</a>
        <button class="btn btn-outline-warning btn-sm" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-1">
      <h1 class="h3 nol-page-title mb-0">Alumnado de <span id="asigTitle"></span></h1>
      <span class="nol-badge" id="mediaBadge">Nota media: —</span>
    </div>
    <p class="text-muted">Consulta la ficha de cada alumno y ajusta su calificación. Usa las flechas para navegar.</p>

    <div class="alert alert-danger d-none" id="errorBox"></div>
    <div class="alert alert-success d-none" id="okBox">Nota actualizada correctamente.</div>
    <div class="alert alert-info d-none" id="vacioBox">No hay alumnos matriculados en esta asignatura.</div>

    <!-- Ficha de alumno (navegable con flechas) -->
    <div class="card shadow-sm nol-card-accent d-none" id="fichaCard">
      <div class="card-body">
        <div class="row g-4">
          <div class="col-md-auto text-center">
            <img id="fichaFoto" class="nol-foto-ficha" alt="Foto del alumno" src="../fotos/_placeholder.svg">
          </div>

          <div class="col">
            <div class="d-flex flex-wrap align-items-center gap-2">
              <h2 class="h4 mb-0" id="fichaNombre">—</h2>
              <span class="badge text-bg-secondary" id="fichaDni"></span>
            </div>
            <p class="text-muted mb-2" id="fichaMatricula"></p>

            <p class="text-muted small mb-3" id="fichaRelleno"></p>

            <label class="form-label" for="fichaNota">Calificación (0 – 10)</label>
            <div class="d-flex gap-2" style="max-width: 320px;">
              <input class="form-control" id="fichaNota" type="number" min="0" max="10" step="0.1">
              <button class="btn btn-primary" id="btnGuardar">Guardar</button>
            </div>
          </div>
        </div>

        <hr>

        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-outline-secondary" id="btnPrev">&larr; Anterior</button>
          <span class="text-muted small" id="contador"></span>
          <button class="btn btn-outline-secondary" id="btnNext">Siguiente &rarr;</button>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    var acronimo = qs('asig');
    setText('asigTitle', acronimo || '');

    var alumnos = [];
    var idx = 0;

    // Texto de relleno (estilo "Lorem ipsum") para dar cuerpo a la ficha académica.
    var RELLENO = 'Estudiante matriculado/a en la asignatura. La información mostrada procede '
      + 'del nivel de datos (CentroEducativo) y se completa con texto de relleno a modo de ficha '
      + 'académica. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor '
      + 'incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation.';

    function pintarFicha() {
      if (!alumnos.length) return;
      var a = alumnos[idx];
      var dni = getDniAlumno(a);

      setText('fichaNombre', getNombreAlumno(a));
      setText('fichaDni', dni);
      setText('fichaMatricula', 'Matriculado/a en: ' + (acronimo || '—'));
      setText('fichaRelleno', RELLENO);

      var foto = document.getElementById('fichaFoto');
      foto.onerror = function () { this.onerror = null; this.src = FOTO_PLACEHOLDER; };
      foto.src = fotoUrl(dni);

      var input = document.getElementById('fichaNota');
      var nota = getNotaAlumno(a);
      input.value = (nota === '' || nota === null || nota === undefined) ? '' : nota;

      setText('contador', 'Alumno/a ' + (idx + 1) + ' de ' + alumnos.length);
      document.getElementById('btnPrev').disabled = (idx === 0);
      document.getElementById('btnNext').disabled = (idx === alumnos.length - 1);
    }

    function actualizarMedia() {
      setText('mediaBadge', 'Nota media: ' + textoMedia(alumnos));
    }

    function mover(delta) {
      var nuevo = idx + delta;
      if (nuevo < 0 || nuevo >= alumnos.length) return;
      idx = nuevo;
      hideError();
      document.getElementById('okBox').classList.add('d-none');
      pintarFicha();
    }

    function guardarNota() {
      hideError();
      var okBox = document.getElementById('okBox');
      okBox.classList.add('d-none');

      var a = alumnos[idx];
      var dni = getDniAlumno(a);
      var input = document.getElementById('fichaNota');
      var nota = parseFloat(input.value);

      if (isNaN(nota) || nota < 0 || nota > 10) {
        showError(new Error('La nota debe ser un número entre 0 y 10.'));
        return;
      }

      ajax(API.profesorNota(acronimo, dni), {
        method: 'POST',
        body: JSON.stringify({ nota: nota })
      }).then(function (data) {
        // Refleja el cambio en memoria para recalcular la media al instante.
        a.nota = nota;
        actualizarMedia();

        var mensaje = (data && data.mensaje) ? data.mensaje : 'Nota actualizada correctamente.';
        okBox.textContent = mensaje;
        okBox.classList.remove('d-none');
      }).catch(showError);
    }

    function renderAlumnos(data) {
      alumnos = safeArray(data);

      if (!alumnos.length) {
        document.getElementById('vacioBox').classList.remove('d-none');
        return;
      }

      document.getElementById('fichaCard').classList.remove('d-none');
      document.getElementById('btnPrev').addEventListener('click', function () { mover(-1); });
      document.getElementById('btnNext').addEventListener('click', function () { mover(1); });
      document.getElementById('btnGuardar').addEventListener('click', guardarNota);

      // Navegación también con las flechas del teclado.
      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') mover(-1);
        if (e.key === 'ArrowRight') mover(1);
      });

      idx = 0;
      actualizarMedia();
      pintarFicha();
    }

    if (!acronimo) {
      showError(new Error('Falta el parámetro asig en la URL.'));
    } else {
      ajax(API.profesorAlumnos(acronimo)).then(renderAlumnos).catch(showError);
    }
  </script>
</body>
</html>
